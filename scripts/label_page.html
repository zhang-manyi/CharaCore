<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台词成对标注</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem;
         line-height: 1.6; color: #1d1d1f; background: #fafafa; }
  .meta { color: #555; font-size: .95rem; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: .8rem 1rem; margin: .8rem 0; }
  .line { font-size: 1.1rem; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .reply { background: #fff; border: 2px solid #888; border-radius: 8px; padding: 1rem; font-size: 1.25rem; min-height: 4rem; }
  .reply h3 { margin: 0 0 .4rem; font-size: .9rem; color: #555; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 1rem 0; }
  .choices { display: flex; flex-wrap: wrap; gap: .5rem; }
  button { font: inherit; padding: .5rem .9rem; border: 1px solid #666; border-radius: 6px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  .nav { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .hint { color: #555; font-size: .9rem; }
  details { margin: .5rem 0; }
</style>
</head>
<body>
<h1>台词成对标注</h1>
<p class="hint">判断哪一句更像这个角色此刻会说的话。来源已隐藏，左右顺序随机。拿不准就选“差不多”或“跳过”，不用强行选。
键盘：1–5 选择，6 跳过，N 切换“两句都不像”，← / → 上一题 / 下一题。进度自动保存在本浏览器中。</p>
<p id="progress" class="meta" aria-live="polite"></p>
<main id="item"></main>
<div class="nav">
  <button id="prev" type="button">← 上一题</button>
  <button id="next" type="button">下一题 →</button>
  <button id="jump" type="button">跳到第一个未标</button>
  <button id="export" type="button">导出标注 JSON</button>
</div>
<script>
const DATA = /*LABEL_DATA*/null;
const CHOICES = [["L2", "1 左边明显更好"], ["L1", "2 左边略好"], ["EQ", "3 差不多"], ["R1", "4 右边略好"],
                 ["R2", "5 右边明显更好"], ["SKIP", "6 跳过 / 判断不了"]];
const STORE = "characore-labels-" + DATA.set_id;
const labels = JSON.parse(localStorage.getItem(STORE) || "{}");
let pos = 0;

function save() { localStorage.setItem(STORE, JSON.stringify(labels)); }
function el(tag, attrs, text) {
  const e = document.createElement(tag);
  Object.assign(e, attrs || {});
  if (text !== undefined) e.textContent = text;
  return e;
}

function render() {
  const it = DATA.items[pos], lab = labels[it.id] || {};
  const root = document.getElementById("item");
  root.replaceChildren();
  root.append(el("h2", {}, `第 ${pos + 1} / ${DATA.items.length} 题：${it.name}`));
  const ctx = el("div", {className: "card"});
  const det = el("details");
  det.append(el("summary", {}, "角色设定（点击展开）"), el("p", {}, it.card));
  ctx.append(det, el("p", {}, "情境：" + it.situation), el("p", {className: "line"}, `${it.speaker}：「${it.line}」`));
  root.append(ctx);
  const pair = el("div", {className: "pair"});
  for (const [side, title] of [["left", "左"], ["right", "右"]]) {
    const box = el("section", {className: "reply"});
    box.setAttribute("aria-label", title + "边回复");
    box.append(el("h3", {}, title), el("p", {}, it[side]));
    pair.append(box);
  }
  root.append(pair);
  const fs = el("fieldset");
  fs.append(el("legend", {}, "哪一句更像角色？"));
  const row = el("div", {className: "choices"});
  for (const [value, text] of CHOICES) {
    const b = el("button", {type: "button"}, text);
    b.setAttribute("aria-pressed", String(lab.choice === value));
    b.onclick = () => choose(value);
    row.append(b);
  }
  fs.append(row);
  const neither = el("input", {type: "checkbox", id: "neither", checked: !!lab.neither});
  neither.onchange = () => setNeither(neither.checked);
  const nl = el("label", {htmlFor: "neither"}, " 两句都不像这个角色（N）");
  const p = el("p");
  p.append(neither, nl);
  fs.append(p);
  root.append(fs);
  const done = DATA.items.filter(x => labels[x.id] && labels[x.id].choice).length;
  document.getElementById("progress").textContent = `已标 ${done} / ${DATA.items.length}`;
}

function choose(value) {
  const id = DATA.items[pos].id;
  labels[id] = Object.assign(labels[id] || {}, {choice: value, at: new Date().toISOString()});
  save();
  if (pos < DATA.items.length - 1) pos++;
  render();
}
function setNeither(on) {
  const id = DATA.items[pos].id;
  labels[id] = Object.assign(labels[id] || {}, {neither: on});
  save();
  render();
}
function move(d) { pos = Math.min(DATA.items.length - 1, Math.max(0, pos + d)); render(); }

document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);
document.getElementById("jump").onclick = () => {
  const i = DATA.items.findIndex(x => !(labels[x.id] && labels[x.id].choice));
  if (i >= 0) { pos = i; render(); }
};
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify({set_id: DATA.set_id, labels}, null, 2)], {type: "application/json"});
  const a = el("a", {href: URL.createObjectURL(blob), download: `labels_${DATA.set_id}.json`});
  document.body.append(a); a.click(); a.remove();
};
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key;
  if (k >= "1" && k <= "6") choose(CHOICES[Number(k) - 1][0]);
  else if (k === "n" || k === "N") setNeither(!(labels[DATA.items[pos].id] || {}).neither);
  else if (k === "ArrowLeft") move(-1);
  else if (k === "ArrowRight") move(1);
});
const first = DATA.items.findIndex(x => !(labels[x.id] && labels[x.id].choice));
pos = first >= 0 ? first : 0;
render();
</script>
</body>
</html>
